{% extends "base.html" %}
{% block title %}Analytics — AgroGuard AI{% endblock %}
{% block content %}
<header class="page-head">
    <h1>Historical Analytics</h1>
    <p>Last 60 readings. Charts are rendered on the server — no client-side JavaScript.</p>
</header>

<section class="chart-grid">
    <div class="chart-card"><img src="{{ url_for('chart', metric='temperature') }}" alt="Temperature over time"></div>
    <div class="chart-card"><img src="{{ url_for('chart', metric='humidity') }}" alt="Humidity over time"></div>
    <div class="chart-card"><img src="{{ url_for('chart', metric='soil') }}" alt="Soil moisture over time"></div>
    <div class="chart-card"><img src="{{ url_for('chart', metric='rain') }}" alt="Rain sensor value over time"></div>
</section>
{% endblock %}
